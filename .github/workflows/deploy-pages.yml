name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build GitHub Pages frontend
        env:
          VITE_API_BASE_URL: ${{ vars.KC_REAL_ESTATE_API_BASE_URL }}
        run: bun run build:pages

      - name: Reject secrets in compiled output
        run: |
          if grep -R -E 'GEMINI_API_KEY|RENTCAST_API_KEY|ZILLOW_MCP_SERVER_URL|PRIVATE KEY-----' dist; then
            echo 'Potential secret material found in dist.' >&2
            exit 1
          fi
          if grep -R -E '(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|(api[_-]?key|secret|token)["'"'"'= :]+[A-Za-z0-9_-]{32,})' dist; then
            echo 'Potential shaped secret material found in dist.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
