name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build standalone backend
        run: bun run build:backend

      - name: Build Pages frontend
        run: bun run build:pages

      - name: Reject secret markers in compiled output
        run: |
          if grep -R -E 'GEMINI_API_KEY|RENTCAST_API_KEY|ZILLOW_MCP_SERVER_URL|PRIVATE KEY-----' dist; then
            echo 'Potential secret material found in dist.' >&2
            exit 1
          fi
